name: Build Jumbostar AAB & APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Create Production .env File
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}" >> .env
          echo "RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}" >> .env
          echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" >> .env
          echo "EMAIL_PASS=${{ secrets.EMAIL_PASS }}" >> .env

      - name: Build Web Application (Static Export)
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Inject google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Decode Keystore & Configure Signing Directly in build.gradle
        run: |
          # 1. Decode the release keystore directly into the android/app folder
          echo "${{ secrets.ANDROID_KEYSTORE_CONTENT }}" | base64 --decode > android/app/jumbostar-release.jks

          # 2. Append the release signing config directly to android/app/build.gradle 
          # This completely bypasses any missing or misread keystore.properties files!
          cat <<EOT >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('jumbostar-release.jks')
                      storePassword '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
                      keyAlias '${{ secrets.ANDROID_KEY_ALIAS }}'
                      keyPassword '${{ secrets.ANDROID_KEY_PASSWORD }}'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOT

      - name: Build Release AAB and APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: jumbostar-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jumbostar-apk
          path: android/app/build/outputs/apk/release/app-release.apk